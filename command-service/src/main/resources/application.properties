spring.application.name=command-service
server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/wallet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.template.retry.enabled=false

# Wallet topology constants (consumed by RabbitConfig)
wallet.exchange=wallet.exchange
wallet.queue.balance-updated=wallet.balance.updated
wallet.routing-key.balance-updated=balance.updated

# Actuator (healthcheck endpoint disponible en /actuator/health)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging
logging.level.com.wallet=INFO
logging.level.org.springframework.amqp=WARN
