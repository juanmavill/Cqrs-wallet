version: "3.8"

# Despliegue en EC2-mono: monolith-reference
# Requiere DOCKERHUB_USER y DATA_HOST con la IP privada de EC2-data.

services:
  monolith-reference:
    image: ${DOCKERHUB_USER}/cqrs-monolith-reference:1.0.0
    container_name: wallet-monolith-reference
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://${DATA_HOST}:3306/wallet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -XX:+UseG1GC"
