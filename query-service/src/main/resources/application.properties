spring.application.name=query-service
server.port=8082

# MongoDB (read store)
spring.data.mongodb.uri=mongodb://mongodb:27017/wallet_read
spring.data.mongodb.auto-index-creation=true

# MySQL (read-only, used solo para seed inicial)
spring.datasource.url=jdbc:mysql://mysql:3306/wallet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.read-only=true

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.max-attempts=5

# Wallet topology constants
wallet.exchange=wallet.exchange
wallet.queue.balance-updated=wallet.balance.updated
wallet.routing-key.balance-updated=balance.updated
wallet.exchange.dlx=wallet.exchange.dlx
wallet.queue.balance-updated.dlq=wallet.balance.updated.dlq
wallet.routing-key.balance-updated.dlq=balance.updated.dlq

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging
logging.level.com.wallet=INFO
logging.level.org.springframework.amqp=WARN
